[project]
name = "mecari-morpheme"
version = "0.1.0"
description = "Japanese morphological analysis using Graph Neural Networks"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
    # GPU default (Linux, CUDA 12.8): pin Torch/vision/audio to cu128
    "torch==2.7.0+cu128",
    "torchvision==0.22.0+cu128",
    "torchaudio==2.7.0+cu128",
    "pytorch-lightning>=2.0.0",
    # PyG core + CUDA extensions (match Torch 2.7.0 + cu128)
    "torch-geometric>=2.5,<3.0",
    "pyg-lib",
    "torch-scatter",
    "torch-sparse",
    "torch-cluster",
    "torch-spline-conv",
    "numpy>=1.24,<2.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "kyoto-reader>=2.5.0",
    # Optional: enabled by default via config
    "wandb>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "ipython>=8.14.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mecari"]

[tool.uv]
index-url = "https://pypi.org/simple"
# Make uv sync sufficient for GPU by adding both PyTorch cu128 and PyG wheels
find-links = [
  "https://download.pytorch.org/whl/cu128",
  "https://data.pyg.org/whl/torch-2.7.0+cu128.html",
]

# torch-cluster等のビルド時にtorchが必要
[tool.uv.extra-build-dependencies]
# Ensure torch is available when resolving extension wheels
torch-geometric = ["torch"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # line too long

[tool.black]
line-length = 120
target-version = ['py311']
